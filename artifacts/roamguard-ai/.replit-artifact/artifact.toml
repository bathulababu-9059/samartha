kind = "web"
previewPath = "/"
title = "RoamGuard AI"
description = "A responsive AI travel companion that compares clearly labeled demo itineraries, monitors simulated disruptions, and asks before applying recovery choices."
version = "1.0.0"
id = "artifacts/roamguard-ai"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20578

[services.development]
run = "pnpm --filter @workspace/roamguard-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/roamguard-ai", "run", "build" ]
serve = "static"
publicDir = "artifacts/roamguard-ai/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20578"
BASE_PATH = "/"
